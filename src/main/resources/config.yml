debug: false

corpse:
  name-format: "&8Труп &f{player}"
  inventory-title-format: "&8Труп &f{player}"
  inspect-format: "*&eОсматривает труп {player}&f*"

requirements: {}
#  1:
#    type: '>='
#    input: '%vault_eco_balance%'
#    output: 1000

decrease-time: 1209600 # 2 weeks
afterworld: afterworld
default-reincarnation-point: world,-142.5,73,172.5,180,0

enabled-worlds:
  - world

# WorldGuard __global__ region flags applied to the afterworld (needs WorldGuard).
world-flags:
  enabled: true
  passthrough: deny      # allow / deny / none
  interact: allow        # allow / deny / none
  deny-spawn:
    - minecraft:strider
    - minecraft:zombified_piglin
    - minecraft:creeper

# Gamerules set on the afterworld (configurable). Keys are gamerule names;
# show_advancement_messages / show_death_messages are accepted as aliases.
gamerules:
  show_advancement_messages: false
  show_death_messages: false

portal:
  visibility-distance: 64
  mode: radius
  radius: 10000
  minX: -10000
  minZ: -10000
  maxX: 10000
  maxZ: 10000

world-generator:
  enabled: true
  seed: ""
  worldborder-enabled: true
  base-height: 63
  height-variation: 6
  detail-height: 5
  lava-level: 67
  bedrock-layers: 3
  primary-scale: 0.0105
  detail-scale: 0.040
  ridge-scale: 0.026

spawns: # min-death: radius
