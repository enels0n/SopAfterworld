debug: false

corpse:
  name-format: "&8Труп &f{player}"
  inventory-title-format: "&8Труп &f{player}"
  inspect-format: "*&eОсматривает труп {player}&f*"

requirements: {}
#  1:
#    type: '>='
#    input: '%vault_eco_balance%'
#    output: 1000

decrease-time: 1209600 # 2 weeks
afterworld: afterworld
default-reincarnation-point: world,-142.5,73,172.5,180,0

enabled-worlds:
  - world

# WorldGuard __global__ region flags applied to the afterworld (needs WorldGuard).
world-flags:
  enabled: true
  passthrough: deny      # allow / deny / none
  interact: allow        # allow / deny / none
  deny-spawn:
    - minecraft:strider
    - minecraft:zombified_piglin
    - minecraft:creeper

# Gamerules set on the afterworld (configurable). Keys are gamerule names;
# show_advancement_messages / show_death_messages are accepted as aliases.
gamerules:
  show_advancement_messages: false
  show_death_messages: false

portal:
  visibility-distance: 64
  mode: radius
  radius: 10000
  minX: -10000
  minZ: -10000
  maxX: 10000
  maxZ: 10000

world-generator:
  enabled: true
  seed: ""
  worldborder-enabled: true
  base-height: 63
  height-variation: 6
  detail-height: 5
  lava-level: 67
  bedrock-layers: 3
  primary-scale: 0.0105
  detail-scale: 0.040
  ridge-scale: 0.026

spawn-distance:
  # The closest rule with key <= deaths is used.
  # A number means fixed radius until the next key.
  # A string means a formula using variable: deaths
  # Functions: sin, cos, tan, asin, acos, atan, sqrt, abs, floor, ceil,
  # round, log, log10, exp, min, max, pow, clamp
  # Constants: pi, e
  # Trigonometric functions use radians.
  deaths:
    0: 5
    1: "round(50 + pow((deaths - 1) / 99, 1.35) * 2450)"
#    10: 111
#    20: "round(900 + log(deaths - 18) * 550)"
#    50: 555 # 50-59
#    60: 666 # 60-99
#    100: "round(5000 + pow((deaths - 100) / 900, 1.5) * 5000)" # 100+
